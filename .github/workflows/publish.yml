name: Publish

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build

  # Every release is sealed by Sigill before it is published: a detached CAdES
  # seal (.p7s) with an RFC 3161 timestamp and a post-quantum hybrid signature,
  # over the exact packages built here. Only digests leave the runner. No seal,
  # no release. nuget.org adds its own repository signature inside the .nupkg,
  # so the file it serves is sealed as well, once it is available (seal-published).
  publish:
    name: Seal and publish to NuGet.org
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC tokens: one exchanged for a short-lived Sigill token, one for the nuget.org key
      contents: write   # GitHub release + assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Pack
        run: |
          dotnet pack src/Sigill.Sdk/Sigill.Sdk.csproj --configuration Release -p:Version="${GITHUB_REF_NAME#v}" --output ./artifacts
          dotnet pack src/Sigill.Sdk.Policy/Sigill.Sdk.Policy.csproj --configuration Release -p:Version="${GITHUB_REF_NAME#v}" --output ./artifacts
      - name: Seal with Sigill
        uses: sigill-ai/evidence-action@29c7582a2072557734f1d566abeaf292462ce46b # v1.1.0
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          mode: seal
          pqc: true
          qualified: true
      # Trusted publishing: nuget.org exchanges this job's GitHub OIDC token for an API key that lives one hour
      # (the policy on nuget.org names this repository and this workflow file). No stored secret.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sigill-ai   # the nuget.org profile that owns the packages
      - name: Push
        # Sigill.Sdk first: Sigill.Sdk.Policy depends on it at the same version.
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          for id in Sigill.Sdk Sigill.Sdk.Policy; do
            dotnet nuget push "./artifacts/$id.$v.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            dotnet nuget push "./artifacts/$id.$v.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: GitHub release with the packages and their seals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg artifacts/*.p7s --clobber

  seal-published:
    name: Seal the packages nuget.org serves
    needs: publish
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/seal-published.yml
    with:
      version: ${{ github.ref_name }}
